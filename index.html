<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#06141b">
  <title>Atlante Fenotipico di Comunità</title>
  <link rel="preload" href="LaLuxes-regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/Newsreader-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/HankenGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="ld-title-container">
    <svg class="ld-title-svg" viewBox="0 0 1000 120" preserveAspectRatio="xMidYMid meet">
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" class="ld-text-outline">
        ATLANTE FENOTIPICO DI COMUNITÀ
      </text>
      <defs>
        <clipPath id="progress-clip">
          <rect x="0" y="0" width="0" height="120" id="progress-rect"/>
        </clipPath>
      </defs>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" class="ld-text-fill" clip-path="url(#progress-clip)">
        ATLANTE FENOTIPICO DI COMUNITÀ
      </text>
    </svg>
  </div>
  <div class="ld-info" id="ld-info">Inizializzazione…</div>
</div>

<!-- 3-D canvas -->
<canvas id="c"></canvas>

<!-- Vignette -->
<div id="vignette"></div>

<!-- Close button (X angolo – solo mobile dettaglio) -->
<button id="zoom-close-btn" aria-label="Chiudi">✕</button>

<!-- Barra superiore -->
<header id="topbar">
  <div class="brand">
    <span class="brand-mark">Atlante Fenotipico <em>di Comunità</em></span>
    <span class="brand-sub">Comunità di Pollica</span>
  </div>
  <button id="help-btn" aria-label="Comandi" title="Comandi">?</button>
</header>

<!-- Deck inferiore -->
<footer id="deck">
  <!-- modalità normale: scrubber -->
  <div class="deck-browse">
    <button class="deck-step" id="step-prev" aria-label="Sposta a sinistra">&#8249;</button>
    <div id="scrubber" role="slider" aria-label="Posizione nella collezione" tabindex="0">
      <div id="scrub-fill"></div>
      <div id="scrub-knob"></div>
    </div>
    <button class="deck-step" id="step-next" aria-label="Sposta a destra">&#8250;</button>
    <button class="deck-step" id="marquee-toggle" aria-label="Scorrimento automatico" title="Scorrimento automatico (S)" aria-pressed="false">&#9654;</button>
  </div>
  <!-- modalità dettaglio: zoom -->
  <div class="deck-detail">
    <button class="deck-nav" id="det-prev" aria-label="Soggetto precedente">&#8249;</button>
    <button id="det-flip" aria-label="Gira la carta">&#8635;<span>Gira</span></button>
    <div class="det-meta">
      <span id="det-label"></span>
      <span id="det-kind"></span>
    </div>
    <button class="deck-nav" id="det-next" aria-label="Soggetto successivo">&#8250;</button>
    <button id="det-close" aria-label="Chiudi">&#10005;<span>Esc</span></button>
  </div>
</footer>

<!-- Legenda comandi -->
<div id="legend">
  <div class="legend-card">
    <button class="legend-close" aria-label="Chiudi">×</button>
    <h2>Come navigare</h2>
    <ul id="legend-list">
      <li><b>Trascina</b> Esplora la griglia</li>
      <li id="zoom-item"><b>Rotella</b> Avvicina / allontana</li>
      <li><b>Click</b> Apri una scheda · cliccala per girarla</li>
      <li id="nav-item"><b>&#8592; &#8594;</b> Soggetto precedente / successivo</li>
      <li id="marquee-item"><b>S</b> Scorrimento automatico · ri-premi (o Esc) per fermare</li>
    </ul>
  </div>
</div>

<!-- Three.js r184 (ES module: dal r160 non esiste più la build globale three.min.js) -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js" } }
</script>

<script type="module" src="main.js"></script>
</body>
</html>
